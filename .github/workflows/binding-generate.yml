name: Generate and commit Go, Python, TypeScript and Java bindings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binding-generate.yml'
      - '.github/actions/binding-tools/**'
      - 'tooling/common/go_bindings.py'
      - 'catalog/**'
      - 'bindings/**/go/**'
      - 'bindings/**/python/**'
      - 'bindings/**/typescript/**'
      - 'bindings/**/java/**'
      - 'tooling/extension-bindings/packages.yaml'
      - 'tooling/extension-bindings/toolchain.lock.yaml'
      - 'tooling/extension-bindings/model/**'
      - 'tooling/extension-bindings/normalizer/**'
      - 'tooling/extension-bindings/emitters/go/**'
      - 'tooling/extension-bindings/emitters/python/**'
      - 'tooling/extension-bindings/emitters/typescript/**'
      - 'tooling/extension-bindings/emitters/java/**'
      - 'tooling/extension-bindings/orchestrator/**'
      - 'tooling/extension-bindings/ci/**'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated package-key:go, package-key:python, package-key:typescript, or package-key:java targets, or all; empty regenerates every target'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: binding-generation-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      # Reading the last successful run of this workflow, to compare the push with.
      actions: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
          # The whole history, so the push can be compared with the commit before it.
          fetch-depth: 0

      - name: Set up Python for target selection
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'

      - name: Install the target selection dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      # Targets typed into a manual run win, then the BINDING_GENERATION_TARGETS
      # variable as a fixed override. Otherwise a push regenerates only what
      # changed since the last successful run of this workflow (or, when that
      # cannot be read, since the commit before the push), so the changes of a run
      # that failed or was cancelled are picked up by the next one: every package
      # for a shared tool, one language for its emitter, a package whose catalog
      # entry changed, and every package whose root extension is or depends on a
      # changed extension. A manual run without targets regenerates everything.
      - name: Choose the targets to regenerate
        id: targets
        shell: bash
        env:
          MANUAL: ${{ inputs.targets }}
          CONFIGURED: ${{ vars.BINDING_GENERATION_TARGETS }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$MANUAL" ]]; then
            targets="$MANUAL"
          elif [[ -n "$CONFIGURED" ]]; then
            targets="$CONFIGURED"
          else
            selection="$RUNNER_TEMP/automatic-targets"
            GITHUB_OUTPUT="$selection" python tooling/extension-bindings/ci/generation.py automatic \
              --since-last-success --base "$BEFORE" --head HEAD
            targets="$(sed -n 's/^targets=//p' "$selection")"
          fi
          echo "INPUT_TARGETS=$targets" >> "$GITHUB_ENV"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Prepare shared binding tools
        if: steps.targets.outputs.targets != ''
        uses: ./.github/actions/binding-tools
        id: tools
        with:
          targets: ${{ env.INPUT_TARGETS }}

      - name: Test generation helper and emitter tooling
        if: steps.targets.outputs.targets != ''
        shell: bash
        env:
          HAS_PYTHON: ${{ steps.tools.outputs.has-python }}
          HAS_TYPESCRIPT: ${{ steps.tools.outputs.has-typescript }}
          HAS_JAVA: ${{ steps.tools.outputs.has-java }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tooling/extension-bindings/ci -p 'test_*.py'
          go -C tooling/extension-bindings/normalizer test -count=1 ./...
          go -C tooling/extension-bindings/emitters/go test -count=1 ./...
          go -C tooling/extension-bindings/orchestrator test -count=1 ./...
          if [[ "$HAS_PYTHON" == true ]]; then
            PYTHONPATH=tooling/extension-bindings/emitters/python/src \
              "$RC_BINDINGS_PYTHON" -m pytest -q -p no:cacheprovider \
              tooling/extension-bindings/emitters/python/tests \
              --ignore=tooling/extension-bindings/emitters/python/tests/test_packages.py
          fi
          if [[ "$HAS_TYPESCRIPT" == true ]]; then
            npm --prefix tooling/extension-bindings/emitters/typescript test
          fi
          if [[ "$HAS_JAVA" == true ]]; then
            gradle --project-dir tooling/extension-bindings/emitters/java test --console=plain
          fi

      - name: Generate and verify bindings
        if: steps.targets.outputs.targets != ''
        env:
          RC: ${{ steps.tools.outputs.rc }}
          CORE_SCHEMA: ${{ steps.tools.outputs.core-schema }}
        run: |
          python tooling/extension-bindings/ci/generate-go.py update --targets "$INPUT_TARGETS" \
            --rc "$RC" --core-schema "$CORE_SCHEMA"
          python tooling/extension-bindings/ci/generate-python.py update --targets "$INPUT_TARGETS" \
            --rc "$RC" --core-schema "$CORE_SCHEMA"
          python tooling/extension-bindings/ci/generate-typescript.py update --targets "$INPUT_TARGETS" \
            --rc "$RC" --core-schema "$CORE_SCHEMA"
          python tooling/extension-bindings/ci/generate-java.py update --targets "$INPUT_TARGETS" \
            --rc "$RC" --core-schema "$CORE_SCHEMA"

      - name: Commit verified generated source to main
        if: steps.targets.outputs.targets != ''
        env:
          SOURCE_COMMIT: ${{ steps.tools.outputs.source-commit }}
        run: python tooling/extension-bindings/ci/generation.py commit --targets "$INPUT_TARGETS" --source-commit "$SOURCE_COMMIT"

      - name: Publish updated discovery pages through the existing docs build
        if: steps.targets.outputs.targets != ''
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN }}
          repository: runtimeconditions/runtimeconditions.github.io
          event-type: extensions-updated
