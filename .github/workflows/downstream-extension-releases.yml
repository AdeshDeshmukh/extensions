name: Release downstream extensions

# When an extension gets a new release, extensions whose newest release still
# depends on an older release of it get their next release too. On pull requests
# this only reports what would be released; after a merge to main it writes the
# new releases and opens (or updates) a pull request for review.

on:
  pull_request:
    paths:
      - "catalog/**/*.yaml"
      - "tooling/common/downstream_releases.py"
      - ".github/workflows/downstream-extension-releases.yml"
  push:
    branches: [main]
    paths:
      - "catalog/**/*.yaml"
      - "tooling/common/downstream_releases.py"
      - ".github/workflows/downstream-extension-releases.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downstream-extension-releases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install prerequisites
        run: python -m pip install --disable-pip-version-check -r tooling/smithy-runtime-conditions/requirements.txt

      - name: Report dependents that will be released after merge
        run: |
          report="$(python tooling/common/downstream_releases.py)"
          echo "$report"
          {
            echo "### Downstream extension releases"
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if python tooling/common/downstream_releases.py --check > /dev/null; then
            exit 0
          fi
          echo "::notice title=Downstream extension releases::After this merges, the dependents listed in the job summary get new releases through a follow-up pull request."

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/downstream-extension-releases
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install prerequisites
        run: python -m pip install --disable-pip-version-check -r tooling/smithy-runtime-conditions/requirements.txt

      - name: Write the next release of each stale dependent
        id: write
        run: |
          python tooling/common/downstream_releases.py --write | tee "$RUNNER_TEMP/releases.txt"
          if [ -z "$(git status --porcelain -- catalog)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the release pull request
        if: steps.write.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add catalog
          git commit -m "Release extensions that depend on a newer release" -m "$(cat "$RUNNER_TEMP/releases.txt")"
          git push --force origin "$BRANCH"
          body="$RUNNER_TEMP/body.md"
          {
            echo "An extension got a new release, so the extensions below, whose newest release still depended on an older release of it, get their next release. Each new file copies the previous release and changes only its id, its version and the dependency identifiers."
            echo
            echo '```'
            cat "$RUNNER_TEMP/releases.txt"
            echo '```'
            echo
            echo "Pull requests opened by this workflow do not start other workflows. Close and reopen this pull request, or push a commit to it, to run the checks."
          } > "$body"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$body"
          else
            gh pr create --head "$BRANCH" --base main --title "Release extensions that depend on a newer release" --body-file "$body"
          fi
