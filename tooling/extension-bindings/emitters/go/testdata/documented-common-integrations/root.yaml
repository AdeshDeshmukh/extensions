apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  id: https://runtimeconditions.io/go-fixture/documented-common-integrations:1.0.0
  version: 1.0.0
spec:
  kinds:
  - name: api
    description: The workload calls another service through a network API, such as an HTTP API or an SMTP
      mail server.
  - name: datastore
    description: The workload stores and reads persistent data in a database.
  - name: cache
    description: The workload keeps frequently used data in a cache for fast access.
  interfaceTypes:
  - name: http
    targetKind: api
    description: The API is reached over HTTP. It is described by an API document, by the operations the
      workload calls, or by both.
  - name: relational
    targetKind: datastore
    description: A relational (SQL) database, such as PostgreSQL or MySQL.
  - name: document
    targetKind: datastore
    description: A document database that stores JSON-like documents, such as MongoDB.
  - name: key_value
    targetKind: cache
    description: A key/value store, such as Redis or Memcached.
  - name: smtp
    targetKind: api
    description: An SMTP server that the workload uses to send email.
  interfaceFields:
  - name: spec
    targetKind: api
    targetType: http
  - name: operations
    targetKind: api
    targetType: http
  - name: engine
    targetKind: datastore
    targetType: relational
  - name: engine
    targetKind: datastore
    targetType: document
  - name: engine
    targetKind: cache
    targetType: key_value
  - name: operations
    targetKind: api
    targetType: smtp
  fieldValues:
  - field: interface.spec.format
    targetKind: api
    targetType: http
    values:
    - openapi
  - field: interface.operations[].method
    targetKind: api
    targetType: http
    values:
    - GET
    - HEAD
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
    - TRACE
  - field: interface.engine
    targetKind: datastore
    targetType: relational
    values:
    - postgres
    - mysql
    - mariadb
    - sqlserver
    - oracle
    - sqlite
  - field: interface.engine
    targetKind: datastore
    targetType: document
    values:
    - mongodb
    - couchbase
  - field: interface.engine
    targetKind: cache
    targetType: key_value
    values:
    - redis
    - memcached
  - field: interface.operations[]
    targetKind: api
    targetType: smtp
    values:
    - send
  schemas:
  - id: api-http-interface
    appliesToKind: api
    appliesToInterfaceType: http
    description: Validates HTTP API integration conditions.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - kind
      - interface
      properties:
        kind:
          const: api
        interface:
          type: object
          required:
          - type
          properties:
            type:
              const: http
            spec:
              type: object
              required:
              - format
              - uri
              properties:
                format:
                  const: openapi
                  description: Format of the API document. Only openapi is defined.
                uri:
                  type: string
                  minLength: 1
                  description: Where the API document can be found, for example a catalog entry such as
                    catalog://api/default/todos-api.
                version:
                  type: string
                  pattern: ^(?:=?[0-9]+\.[0-9]+\.[0-9]+|[<>]=?[0-9]+\.[0-9]+\.[0-9]+|\^[0-9]+\.[0-9]+\.[0-9]+|~[0-9]+\.[0-9]+\.[0-9]+)$
                  description: 'The API version the workload is written against: an exact version such
                    as 1.2.0, or a range such as ^1.2.0 or >=1.2.0.'
              additionalProperties: false
              description: A machine-readable description of the API that the workload depends on.
            operations:
              type: array
              minItems: 1
              items:
                type: object
                required:
                - method
                - path
                properties:
                  method:
                    enum:
                    - GET
                    - HEAD
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                    - OPTIONS
                    - TRACE
                    description: HTTP method of the operation, such as GET or POST.
                  path:
                    type: string
                    minLength: 1
                    description: Request path of the operation, for example /todos/{id}. Path parameters
                      are written in braces.
                  requestBodySchema:
                    $ref: '#/$defs/simpleSchema'
                    description: Shape of the request body that the workload sends.
                  responseSchema:
                    $ref: '#/$defs/simpleSchema'
                    description: Shape of the response body that the workload expects back.
                additionalProperties: false
                description: One HTTP operation the workload calls.
              description: The HTTP operations the workload calls. A platform can use them to allow only
                these calls.
          anyOf:
          - required:
            - spec
          - required:
            - operations
          additionalProperties: true
          description: How the workload reaches the HTTP API. Give spec, operations, or both.
      additionalProperties: true
      $defs:
        simpleSchema:
          oneOf:
          - type: string
            enum:
            - string
            - number
            - integer
            - boolean
            - 'null'
          - type: object
            additionalProperties:
              $ref: '#/$defs/simpleSchema'
          - type: array
            minItems: 1
            maxItems: 1
            items:
              $ref: '#/$defs/simpleSchema'
          description: 'A simple data shape: the name of a scalar type (string, number, integer, boolean
            or null), an object whose values are simple schemas, or a list with one simple schema that
            describes every item.'
  - id: datastore-relational-interface
    appliesToKind: datastore
    appliesToInterfaceType: relational
    description: Validates relational datastore integration conditions.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - kind
      - interface
      properties:
        kind:
          const: datastore
        interface:
          type: object
          required:
          - type
          properties:
            type:
              const: relational
            engine:
              enum:
              - postgres
              - mysql
              - mariadb
              - sqlserver
              - oracle
              - sqlite
              description: The relational database engine the workload needs, for example postgres or
                mysql. Leave it out if any relational engine works.
          additionalProperties: true
          description: How the workload reaches the database.
      additionalProperties: true
  - id: datastore-document-interface
    appliesToKind: datastore
    appliesToInterfaceType: document
    description: Validates document datastore integration conditions.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - kind
      - interface
      properties:
        kind:
          const: datastore
        interface:
          type: object
          required:
          - type
          properties:
            type:
              const: document
            engine:
              enum:
              - mongodb
              - couchbase
              description: The document database engine the workload needs, mongodb or couchbase. Leave
                it out if any document engine works.
          additionalProperties: true
          description: How the workload reaches the database.
      additionalProperties: true
  - id: cache-key-value-interface
    appliesToKind: cache
    appliesToInterfaceType: key_value
    description: Validates key/value cache integration conditions.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - kind
      - interface
      properties:
        kind:
          const: cache
        interface:
          type: object
          required:
          - type
          properties:
            type:
              const: key_value
            engine:
              enum:
              - redis
              - memcached
              description: The cache engine the workload needs, redis or memcached. Leave it out if any
                key/value engine works.
          additionalProperties: true
          description: How the workload reaches the cache.
      additionalProperties: true
  - id: api-smtp-interface
    appliesToKind: api
    appliesToInterfaceType: smtp
    description: Validates SMTP email submission requirements.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required:
      - kind
      - interface
      properties:
        kind:
          const: api
        interface:
          type: object
          required:
          - type
          - operations
          properties:
            type:
              const: smtp
            operations:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                enum:
                - send
              description: The SMTP operations the workload performs. Only send (submitting email) is
                defined.
          additionalProperties: true
          description: How the workload uses the SMTP server.
      additionalProperties: true
