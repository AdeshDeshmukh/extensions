scopes:
    - coordinate: api:http
      kind: api
      interfaceType: http
      applicableSchemas:
        - https://runtimeconditions.io/conformance/documented-extension:1.0.0#schema:api-http-interface
      projection:
        kind: object
        required:
            - interface
        properties:
            - name: interface
              required: true
              shape:
                kind: object
                properties:
                    - name: operations
                      shape:
                        kind: array
                        items:
                            kind: object
                            required:
                                - method
                                - path
                            properties:
                                - name: method
                                  required: true
                                  shape:
                                    kind: scalar
                                    scalar: string
                                    values:
                                        - value: DELETE
                                          description: Delete a resource.
                                        - value: GET
                                          description: Read a resource.
                                        - value: HEAD
                                          description: Read only the headers of a resource.
                                        - value: OPTIONS
                                          description: Ask which methods a resource supports.
                                        - value: PATCH
                                          description: Change part of a resource.
                                        - value: POST
                                          description: Create a resource or submit data.
                                        - value: PUT
                                          description: Replace a resource.
                                        - value: TRACE
                                          description: Echo the request back, for diagnostics.
                                    description: HTTP method of the operation. Must be one of the defined methods.
                                    provenance:
                                        owner: https://runtimeconditions.io/conformance/documented-extension:1.0.0
                                        extensionSha256: dea80be6e41d4b0f7b7035dae22521dd48f8f9bc9f6250f33e21bfde7e4c3fe7
                                        coordinate: https://runtimeconditions.io/conformance/documented-extension:1.0.0#schema:api-http-interface
                                        jsonPointer: /properties/interface/properties/operations/items/properties/method
                                  provenance:
                                    owner: https://runtimeconditions.io/conformance/documented-extension:1.0.0
                                    extensionSha256: dea80be6e41d4b0f7b7035dae22521dd48f8f9bc9f6250f33e21bfde7e4c3fe7
                                    coordinate: https://runtimeconditions.io/conformance/documented-extension:1.0.0#schema:api-http-interface
                                    jsonPointer: /properties/interface/properties/operations/items/properties/method
                                - name: path
                                  required: true
                                  shape:
                                    kind: scalar
                                    scalar: string
                                    constraints:
                                        minLength: 1
