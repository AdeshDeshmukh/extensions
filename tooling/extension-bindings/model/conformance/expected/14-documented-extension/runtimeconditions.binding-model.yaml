    ownedDeclarations:
        - coordinate: kind:api
          owner: https://runtimeconditions.io/conformance/documented-extension:1.0.0
          kind: api
          description: |-
            The workload calls another service through a network API, such as an HTTP API or an SMTP mail server.

            Example: a workload that reads todos from an HTTP API described by an OpenAPI document.

            ```condition
            kind: api
            interface:
              type: http
              spec:
                format: openapi
                uri: catalog://api/default/todos-api
                version: 1.0.0
              operations:
                - method: GET
                  path: /todos/{id}
            ```

            Example: a workload that sends email through an SMTP server.

            ```condition
            kind: api
            interface:
              type: smtp
              operations: [send]
            ```
          provenance:
            owner: https://runtimeconditions.io/conformance/documented-extension:1.0.0
            extensionSha256: dea80be6e41d4b0f7b7035dae22521dd48f8f9bc9f6250f33e21bfde7e4c3fe7
            coordinate: kind:api
        - coordinate: kind:cache
          owner: https://runtimeconditions.io/conformance/documented-extension:1.0.0
          kind: cache
          description: |-
            The workload keeps frequently used data in a cache for fast access.

            Example: a workload that needs Redis.

            ```condition
            kind: cache
            interface:
              type: key_value
              engine: redis
            ```

            Example: a workload that accepts any key/value cache.

            ```condition
            kind: cache
            interface:
              type: key_value
            ```
          provenance:
            owner: https://runtimeconditions.io/conformance/documented-extension:1.0.0
            extensionSha256: dea80be6e41d4b0f7b7035dae22521dd48f8f9bc9f6250f33e21bfde7e4c3fe7
            coordinate: kind:cache
        - coordinate: kind:datastore
          owner: https://runtimeconditions.io/conformance/documented-extension:1.0.0
          kind: datastore
          description: |-
            The workload stores and reads persistent data in a database.

            Example: a workload that needs a PostgreSQL database.

            ```condition
            kind: datastore
            interface:
              type: relational
              engine: postgres
            ```
          provenance:
            owner: https://runtimeconditions.io/conformance/documented-extension:1.0.0
            extensionSha256: dea80be6e41d4b0f7b7035dae22521dd48f8f9bc9f6250f33e21bfde7e4c3fe7
            coordinate: kind:datastore
