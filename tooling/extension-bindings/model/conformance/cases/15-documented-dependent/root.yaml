apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsExtensionDefinition
metadata:
  id: https://runtimeconditions.io/conformance/documented-dependent:1.0.0
  version: 1.0.0
  description: |-
    Environment variables a workload reads to reach the integrations it depends on.

    The platform fills them in, so addresses and secrets never live in the code.
spec:
  dependencies:
  - https://runtimeconditions.io/conformance/documented-extension:1.0.0
  conditionFields:
  - name: configuration
    appliesToKinds:
    - api
    appliesToInterfaceTypes:
    - http
    description: |-
      How the platform passes the address and credentials of the HTTP API to the workload.

      Example: a workload that calls one operation of the todos API and accepts either a base URL with a token
      or a single URL.

      ```condition
      kind: api
      interface:
        type: http
        operations:
        - method: GET
          path: /todos/{id}
      configuration:
        alternatives:
        - env:
          - property: baseUrl
            name: TODOS_API_URL
          - property: token
            name: TODOS_API_TOKEN
            sensitive: true
        - env:
          - property: url
            name: TODOS_URL
      ```
  - name: configuration
    appliesToKinds:
    - cache
    appliesToInterfaceTypes:
    - key_value
    description: |-
      How the platform passes the cache address to the workload, as environment variables.

      Example: a workload that needs a Redis cache and cannot start without its URL.

      ```condition
      kind: cache
      interface:
        type: key_value
        engine: redis
      configuration:
        env:
        - property: url
          name: REDIS_URL
          required: true
      ```
  schemas:
  - id: configuration-api-http
    appliesToKind: api
    appliesToInterfaceType: http
    description: Validates the environment configuration of HTTP API integrations.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        configuration:
          type: object
          oneOf:
          - required:
            - env
            properties:
              env:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: object
                  required:
                  - property
                  - name
                  properties:
                    property:
                      type: string
                      minLength: 1
                      description: Which connection detail the variable carries, such as url or password. Must not
                        be empty; each integration allows a fixed set of properties.
                    name:
                      type: string
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      description: The environment variable name, for example REDIS_URL. Must start with a letter
                        or underscore and contain only letters, digits and underscores.
                    sensitive:
                      type: boolean
                      description: True when the value is a secret, such as a password or token, so the platform
                        can store and pass it securely.
                    required:
                      type: boolean
                      description: True when the workload cannot start without this variable.
                  additionalProperties: false
                  description: One environment variable the workload reads. Requires property and name; no other
                    properties are allowed.
                description: List at least one environment variable, without repeats.
            additionalProperties: false
          - required:
            - alternatives
            properties:
              alternatives:
                type: array
                minItems: 2
                items:
                  type: object
                  required:
                  - env
                  properties:
                    env:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items:
                        type: object
                        required:
                        - property
                        - name
                        properties:
                          property:
                            type: string
                            minLength: 1
                            description: Which connection detail the variable carries, such as url or password.
                              Must not be empty; each integration allows a fixed set of properties.
                          name:
                            type: string
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            description: The environment variable name, for example REDIS_URL. Must start with a
                              letter or underscore and contain only letters, digits and underscores.
                          sensitive:
                            type: boolean
                            description: True when the value is a secret, such as a password or token, so the platform
                              can store and pass it securely.
                          required:
                            type: boolean
                            description: True when the workload cannot start without this variable.
                        additionalProperties: false
                        description: One environment variable the workload reads. Requires property and name; no
                          other properties are allowed.
                      description: List at least one environment variable, without repeats.
                  additionalProperties: false
                  description: One alternative. Requires env; no other properties are allowed.
                description: List at least two alternative sets of variables. The platform satisfies one of them.
            additionalProperties: false
          description: Give either env (one set of variables) or alternatives (two or more sets the workload accepts,
            in order of preference), not both.
      additionalProperties: true
  - id: configuration-cache-key-value
    appliesToKind: cache
    appliesToInterfaceType: key_value
    description: Validates the environment configuration of key/value cache integrations.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        configuration:
          type: object
          oneOf:
          - required:
            - env
            properties:
              env:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: object
                  required:
                  - property
                  - name
                  properties:
                    property:
                      type: string
                      minLength: 1
                      description: Which connection detail the variable carries, such as url or password. Must not
                        be empty; each integration allows a fixed set of properties.
                    name:
                      type: string
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      description: The environment variable name, for example REDIS_URL. Must start with a letter
                        or underscore and contain only letters, digits and underscores.
                    sensitive:
                      type: boolean
                      description: True when the value is a secret, such as a password or token, so the platform
                        can store and pass it securely.
                    required:
                      type: boolean
                      description: True when the workload cannot start without this variable.
                  additionalProperties: false
                  description: One environment variable the workload reads. Requires property and name; no other
                    properties are allowed.
                description: List at least one environment variable, without repeats.
            additionalProperties: false
          - required:
            - alternatives
            properties:
              alternatives:
                type: array
                minItems: 2
                items:
                  type: object
                  required:
                  - env
                  properties:
                    env:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items:
                        type: object
                        required:
                        - property
                        - name
                        properties:
                          property:
                            type: string
                            minLength: 1
                            description: Which connection detail the variable carries, such as url or password.
                              Must not be empty; each integration allows a fixed set of properties.
                          name:
                            type: string
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            description: The environment variable name, for example REDIS_URL. Must start with a
                              letter or underscore and contain only letters, digits and underscores.
                          sensitive:
                            type: boolean
                            description: True when the value is a secret, such as a password or token, so the platform
                              can store and pass it securely.
                          required:
                            type: boolean
                            description: True when the workload cannot start without this variable.
                        additionalProperties: false
                        description: One environment variable the workload reads. Requires property and name; no
                          other properties are allowed.
                      description: List at least one environment variable, without repeats.
                  additionalProperties: false
                  description: One alternative. Requires env; no other properties are allowed.
                description: List at least two alternative sets of variables. The platform satisfies one of them.
            additionalProperties: false
          description: Give either env (one set of variables) or alternatives (two or more sets the workload accepts,
            in order of preference), not both.
      additionalProperties: true
