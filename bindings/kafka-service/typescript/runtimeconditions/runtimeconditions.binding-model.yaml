    ownedDeclarations:
        - coordinate: kind:kafka.service
          owner: https://runtimeconditions.io/extensions/kafka/service/0.2.0/runtimeconditions.extension.yaml
          kind: kafka.service
          description: |-
            Your workload needs a Kafka cluster with the topics and consumer groups listed in the Condition.

            Example: a billing workload. It reads new orders from the orders topic, as part of the billing
            consumer group. It writes a message to the invoices topic for each order.

            ```condition
            kind: kafka.service
            interface:
              type: service
              operations:
                - resource: topic
                  action: read
                  topic: orders
                - resource: group
                  action: read
                  groupId: billing
                - resource: topic
                  action: write
                  topic: invoices
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/kafka/service/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: a7982b8e4f25bfc1e22c545152cd8767e2282bf6140039d32fb1eeceb8ab79be
            coordinate: kind:kafka.service
    interfaces:
        - coordinate: interface:kafka.service:service
          owner: https://runtimeconditions.io/extensions/kafka/service/0.2.0/runtimeconditions.extension.yaml
          kind: kafka.service
          type: service
          description: |-
            Your workload connects to Kafka with a normal Kafka client library.

            Example: a workload that only sends page-view events to Kafka and never reads them.

            ```condition
            kind: kafka.service
            interface:
              type: service
              operations:
