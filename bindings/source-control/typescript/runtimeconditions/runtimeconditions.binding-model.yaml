          owner: https://runtimeconditions.io/extensions/rc/source-control/0.2.0/runtimeconditions.extension.yaml
          kind: rc.source_control
          description: |-
            Your workload needs access to a Git repository.

            Example: a build tool that clones a repository on GitHub and fetches new changes.

            ```condition
            kind: rc.source_control
            interface:
              type: git
              provider: github
              access: [clone, fetch]
            ```
