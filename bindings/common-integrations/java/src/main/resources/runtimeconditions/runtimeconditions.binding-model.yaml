      id: api-http-interface
      kind: api
      interfaceType: http
      exact:
        $defs:
            simpleSchema:
                description: 'A simple data shape. Must be one of: the name of a scalar type (string, number, integer, boolean or null); an object whose values are simple schemas; or a list with exactly one simple schema, which describes every item.'
                oneOf:
                    - additionalProperties:
                        $ref: '#/$defs/simpleSchema'
                      type: object
                    - enum:
                        - boolean
                        - integer
                        - "null"
                        - number
                        - string
                      type: string
                    - items:
                        $ref: '#/$defs/simpleSchema'
                      maxItems: 1
                      minItems: 1
                      type: array
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: true
        properties:
            interface:
                additionalProperties: true
                anyOf:
                    - required:
                        - operations
                    - required:
                        - spec
                description: Give spec, operations, or both.
                properties:
                    operations:
                        description: List at least one operation.
                        items:
                            additionalProperties: false
                            description: One HTTP operation. Requires method and path; no other properties are allowed.
                            properties:
                                method:
                                    description: HTTP method of the operation. Must be one of the defined methods.
                                    enum:
                                        - DELETE
                                        - GET
                                        - HEAD
                                        - OPTIONS
                                        - PATCH
                                        - POST
                                        - PUT
                                        - TRACE
                                path:
                                    description: Request path of the operation, for example /todos/{id}, with path parameters in braces. Must not be empty.
                                    minLength: 1
                                    type: string
                                requestBodySchema:
                                    $ref: '#/$defs/simpleSchema'
                                    description: Shape of the request body that the workload sends.
                                responseSchema:
                                    $ref: '#/$defs/simpleSchema'
                                    description: Shape of the response body that the workload expects back.
                            required:
                                - method
                                - path
                            type: object
                        minItems: 1
                        type: array
                    spec:
                        additionalProperties: false
                        description: Requires format and uri. No other properties are allowed.
                        properties:
                            format:
                                const: openapi
                                description: Format of the API document. Must be openapi.
                            uri:
                                description: Where the API document can be found, for example catalog://api/default/todos-api. Must not be empty.
                                minLength: 1
                                type: string
                            version:
                                description: The API version the workload is written against. Must be an exact version (1.2.0 or =1.2.0), a comparison (>1.2.0, >=1.2.0, <2.0.0, <=2.0.0), a caret range (^1.2.0) or a tilde range (~1.2.0).
