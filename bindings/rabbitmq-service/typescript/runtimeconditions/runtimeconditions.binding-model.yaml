                description: |-
                    Your workload connects to RabbitMQ with a normal AMQP 0-9-1 client library, the protocol that most
                    RabbitMQ clients use.

                    Example: a workload that reads messages from the order-emails queue to send order emails. The
                    virtual host / is the default one.

                    ```condition
                    kind: rabbitmq.service
                    interface:
                      type: amqp_0_9_1
                      virtualHost: /
                      operations:
                        - resource: queue
                          action: consume
                          queue: order-emails
