    ownedDeclarations:
        - coordinate: kind:rabbitmq.service
          owner: https://runtimeconditions.io/extensions/rabbitmq/service/0.2.0/runtimeconditions.extension.yaml
          kind: rabbitmq.service
          description: |-
            Your workload needs a RabbitMQ server with the exchanges and queues listed in the Condition.

            Example: a workload that sends an event to the order-events exchange, with the routing key
            orders.created, each time someone places an order.

            ```condition
            kind: rabbitmq.service
            interface:
              type: amqp_0_9_1
              virtualHost: /orders
              operations:
                - resource: exchange
                  action: publish
                  exchange: order-events
                  routingKey: orders.created
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/rabbitmq/service/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: e2a280bd526628d3882553bc2041e823e713147c6bd0bfe978cdf4efa51e7b37
            coordinate: kind:rabbitmq.service
    interfaces:
