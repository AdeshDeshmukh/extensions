    ownedDeclarations:
        - coordinate: kind:rabbitmq.service
          owner: https://runtimeconditions.io/extensions/rabbitmq/service/0.1.0/runtimeconditions.extension.yaml
          kind: rabbitmq.service
          description: |-
            A RabbitMQ service providing access to exchanges and queues in a virtual host.

            Example: publish order events through a named exchange.

            ```condition
            kind: rabbitmq.service
            interface:
              type: amqp_0_9_1
              virtualHost: /orders
              operations:
                - resource: exchange
                  action: publish
                  exchange: order-events
                  routingKey: orders.created
            ```
