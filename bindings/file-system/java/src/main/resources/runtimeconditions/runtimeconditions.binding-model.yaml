    ownedDeclarations:
        - coordinate: kind:rc.file_system
          owner: https://runtimeconditions.io/extensions/rc/file-system/0.2.0/runtimeconditions.extension.yaml
          kind: rc.file_system
          description: |-
            Your workload needs a folder from the file system.

            Example: a workload that keeps its media library in /var/lib/media-library. It writes there, the
            files must still be there after a restart, and the folder needs at least 10 GiB of space.

            ```condition
            kind: rc.file_system
            interface:
              type: mount
              path: /var/lib/media-library
              access: read_write
              persistence: persistent
              minimumSize: 10Gi
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/file-system/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 0773214ca12f57e205edfea7c446791de90936c0dd078ba6e29526bf799a1a3a
            coordinate: kind:rc.file_system
    interfaces:
        - coordinate: interface:rc.file_system:mount
          owner: https://runtimeconditions.io/extensions/rc/file-system/0.2.0/runtimeconditions.extension.yaml
          kind: rc.file_system
          type: mount
          description: |-
            A folder that the platform mounts into your workload at a path.

            Example: a workload that reads its settings from files in /etc/media-library. It never writes there.

            ```condition
            kind: rc.file_system
            interface:
              type: mount
              path: /etc/media-library
              access: read_only
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/file-system/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 0773214ca12f57e205edfea7c446791de90936c0dd078ba6e29526bf799a1a3a
            coordinate: interface:rc.file_system:mount
    conditionFields:
