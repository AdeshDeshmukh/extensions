      id: observability-otlp-export
      kind: rc.observability
      interfaceType: otlp_export
      exact:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: true
        properties:
            interface:
                additionalProperties: true
                properties:
                    signals:
                        description: Must contain one or more distinct trace, metric, or log signals.
                        items:
