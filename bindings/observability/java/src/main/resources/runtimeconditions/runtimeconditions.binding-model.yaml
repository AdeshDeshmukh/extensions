    ownedDeclarations:
        - coordinate: kind:rc.observability
          owner: https://runtimeconditions.io/extensions/rc/observability/0.2.0/runtimeconditions.extension.yaml
          kind: rc.observability
          description: |-
            Your workload sends telemetry to the platform, or shows telemetry that the platform must collect.

            Example: a workload that sends its traces and logs with OpenTelemetry over gRPC.

            ```condition
            kind: rc.observability
            interface:
              type: otlp_export
              signals: [traces, logs]
              transport: grpc
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/observability/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 3d6e3c01815f7313aa32459c76a5b7d72fede24113f31d81a4f60edee3d231e7
            coordinate: kind:rc.observability
    interfaces:
        - coordinate: interface:rc.observability:otlp_export
          owner: https://runtimeconditions.io/extensions/rc/observability/0.2.0/runtimeconditions.extension.yaml
          kind: rc.observability
          type: otlp_export
          description: |-
            Your workload sends telemetry to an OpenTelemetry (OTLP) receiver.

            Example: a workload that sends its traces, metrics and logs with OpenTelemetry over HTTP.

            ```condition
            kind: rc.observability
            interface:
              type: otlp_export
              signals: [traces, metrics, logs]
              transport: http/protobuf
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/observability/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 3d6e3c01815f7313aa32459c76a5b7d72fede24113f31d81a4f60edee3d231e7
