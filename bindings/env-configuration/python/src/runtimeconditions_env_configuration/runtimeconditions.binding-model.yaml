                        jsonPointer: /$defs/configuration/properties/env
                description: |-
                    How the platform passes the connection details of the database to the workload, as environment
                    variables.

                    Example: a workload that accepts either one PostgreSQL connection URL or separate host, port, user,
                    password and database variables. The platform provides one of the two sets.

                    ```condition
                    kind: datastore
                    interface:
                      type: relational
                      engine: postgres
                    configuration:
                      alternatives:
                      - env:
                        - property: url
                          name: DATABASE_URL
                          sensitive: true
                      - env:
                        - property: hostname
                          name: DB_HOST
                        - property: port
                          name: DB_PORT
                        - property: username
                          name: DB_USER
                        - property: password
                          name: DB_PASSWORD
                          sensitive: true
                        - property: database
                          name: DB_NAME
                    ```

                    Give either env (one set of variables) or alternatives (two or more sets the workload accepts, in order of preference), not both.
                provenance:
                    owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
                    extensionSha256: a40693806d0f141de4661b192d7702dd936cd6b2a43665c3fc864e3a2d086625
