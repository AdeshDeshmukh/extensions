          owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
          kind: api
          type: smtp
          description: An SMTP mail server that the workload uses to send email, such as sign-up confirmations, password resets or alerts.
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: 650270ce3b6d65bd9ab324c7b74fce13fca362b888471e196b54041786d3669e
            coordinate: interface:api:smtp
        - coordinate: interface:cache:key_value
          owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
          kind: cache
          type: key_value
          description: A key/value store, such as Redis or Memcached, for data the workload reads often and can afford to lose. Set engine when the workload needs one specific store.
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: 650270ce3b6d65bd9ab324c7b74fce13fca362b888471e196b54041786d3669e
            coordinate: interface:cache:key_value
        - coordinate: interface:datastore:document
          owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
          kind: datastore
          type: document
          description: A document database that stores JSON-like records, such as MongoDB. Set engine when the workload needs one specific database.
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: 650270ce3b6d65bd9ab324c7b74fce13fca362b888471e196b54041786d3669e
            coordinate: interface:datastore:document
        - coordinate: interface:datastore:relational
          owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
          kind: datastore
          type: relational
          description: A relational (SQL) database, such as PostgreSQL or MySQL, where data lives in tables. Set engine when the workload needs one specific database.
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: 650270ce3b6d65bd9ab324c7b74fce13fca362b888471e196b54041786d3669e
            coordinate: interface:datastore:relational
    conditionFields:
        - coordinate: condition-field:api:http:configuration
          owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
          kind: api
          interfaceType: http
          description: |-
            How the platform passes the address and credentials of the HTTP API to the workload, as environment
            variables.

            Example: a workload that reads the todos API base URL and an access token from its environment.

            ```condition
            kind: api
            interface:
              type: http
              spec:
                format: openapi
                uri: catalog://api/default/todos-api
            configuration:
              env:
              - property: baseUrl
                name: TODOS_API_URL
                required: true
              - property: token
                name: TODOS_API_TOKEN
                sensitive: true
            ```
          path: configuration
          segments:
            - name: configuration
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: a40693806d0f141de4661b192d7702dd936cd6b2a43665c3fc864e3a2d086625
            coordinate: condition-field:api:http:configuration
        - coordinate: condition-field:api:smtp:configuration
          owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
          kind: api
          interfaceType: smtp
          description: |-
            How the platform passes the SMTP server details and email addresses to the workload, as environment
            variables.

            Example: a workload that sends email through an SMTP server and reads the server, login and sender
            address from its environment.

            ```condition
            kind: api
            interface:
              type: smtp
              operations:
              - send
            configuration:
              env:
              - property: hostname
                name: SMTP_HOST
                required: true
              - property: port
                name: SMTP_PORT
              - property: username
                name: SMTP_USER
              - property: password
                name: SMTP_PASSWORD
                sensitive: true
              - property: fromAddress
                name: MAIL_FROM
            ```
          path: configuration
          segments:
            - name: configuration
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: a40693806d0f141de4661b192d7702dd936cd6b2a43665c3fc864e3a2d086625
            coordinate: condition-field:api:smtp:configuration
        - coordinate: condition-field:cache:key_value:configuration
          owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
          kind: cache
          interfaceType: key_value
          description: |-
            How the platform passes the connection details of the cache to the workload, as environment variables.

            Example: a workload that needs a Redis cache and cannot start without its URL.

            ```condition
            kind: cache
            interface:
              type: key_value
              engine: redis
            configuration:
              env:
              - property: url
                name: REDIS_URL
                required: true
            ```
          path: configuration
          segments:
            - name: configuration
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: a40693806d0f141de4661b192d7702dd936cd6b2a43665c3fc864e3a2d086625
            coordinate: condition-field:cache:key_value:configuration
        - coordinate: condition-field:datastore:document:configuration
          owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
          kind: datastore
          interfaceType: document
          description: |-
            How the platform passes the connection details of the database to the workload, as environment
            variables.

            Example: a workload that accepts either one PostgreSQL connection URL or separate host, port, user,
            password and database variables. The platform provides one of the two sets.

            ```condition
            kind: datastore
            interface:
              type: relational
              engine: postgres
            configuration:
              alternatives:
              - env:
                - property: url
                  name: DATABASE_URL
                  sensitive: true
              - env:
                - property: hostname
                  name: DB_HOST
                - property: port
                  name: DB_PORT
                - property: username
                  name: DB_USER
                - property: password
                  name: DB_PASSWORD
                  sensitive: true
                - property: database
                  name: DB_NAME
            ```
          path: configuration
          segments:
            - name: configuration
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: a40693806d0f141de4661b192d7702dd936cd6b2a43665c3fc864e3a2d086625
            coordinate: condition-field:datastore:document:configuration
