scopes:
    - coordinate: api:http
      kind: api
      interfaceType: http
      applicableSchemas:
        - https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml#schema:api-http-interface
        - https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml#schema:configuration-properties-api-http
        - https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml#schema:configuration-shape
      projection:
        kind: object
        required:
            - interface
        properties:
            - name: configuration
              shape:
                kind: object
                properties:
                    - name: alternatives
                      shape:
                        kind: array
                        items:
                            kind: object
                            required:
                                - env
                            properties:
                                - name: env
                                  required: true
                                  shape:
                                    kind: array
                                    items:
                                        kind: object
                                        required:
                                            - name
                                            - property
                                        properties:
                                            - name: name
                                              required: true
                                              shape:
                                                kind: scalar
                                                scalar: string
                                                constraints:
                                                    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                                                description: The environment variable name, for example REDIS_URL. Must start with a letter or underscore and contain only letters, digits and underscores.
                                                provenance:
                                                    owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
                                                    extensionSha256: a40693806d0f141de4661b192d7702dd936cd6b2a43665c3fc864e3a2d086625
                                                    coordinate: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml#schema:configuration-shape
                                                    jsonPointer: /$defs/envInput/properties/name
                                              provenance:
                                                owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
                                                extensionSha256: a40693806d0f141de4661b192d7702dd936cd6b2a43665c3fc864e3a2d086625
                                                coordinate: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml#schema:configuration-shape
                                                jsonPointer: /$defs/envInput/properties/name
                                            - name: property
                                              required: true
                                              shape:
                                                kind: scalar
                                                scalar: string
                                                values:
