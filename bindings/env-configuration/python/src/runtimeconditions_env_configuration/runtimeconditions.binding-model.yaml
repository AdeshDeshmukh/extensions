    importedDeclarations:
        - coordinate: kind:api
          owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
          kind: api
          description: |-
            The workload calls another service through a network API, such as an HTTP API or an SMTP mail server.

            Example: a workload that reads todos from an HTTP API described by an OpenAPI document.

            ```condition
            kind: api
            interface:
              type: http
              spec:
                format: openapi
                uri: catalog://api/default/todos-api
                version: 1.0.0
              operations:
                - method: GET
                  path: /todos/{id}
            ```

            Example: a workload that sends email through an SMTP server.

            ```condition
            kind: api
            interface:
              type: smtp
              operations: [send]
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: 650270ce3b6d65bd9ab324c7b74fce13fca362b888471e196b54041786d3669e
            coordinate: kind:api
        - coordinate: kind:cache
          owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
          kind: cache
          description: |-
            The workload keeps frequently used data in a cache for fast access.

            Example: a workload that needs Redis.

            ```condition
            kind: cache
            interface:
              type: key_value
              engine: redis
            ```

            Example: a workload that accepts any key/value cache.

            ```condition
            kind: cache
            interface:
              type: key_value
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: 650270ce3b6d65bd9ab324c7b74fce13fca362b888471e196b54041786d3669e
            coordinate: kind:cache
        - coordinate: kind:datastore
          owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
          kind: datastore
          description: |-
            The workload stores and reads persistent data in a database.

            Example: a workload that needs a PostgreSQL database.

            ```condition
            kind: datastore
            interface:
              type: relational
              engine: postgres
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: 650270ce3b6d65bd9ab324c7b74fce13fca362b888471e196b54041786d3669e
            coordinate: kind:datastore
    interfaces:
        - coordinate: interface:api:http
          owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
          kind: api
          type: http
          description: The API is reached over HTTP. It is described by an API document, by the operations the workload calls, or by both.
          provenance:
            owner: https://runtimeconditions.io/extensions/rc/common-integrations/v1alpha4/runtimeconditions.extension.yaml
            extensionSha256: 650270ce3b6d65bd9ab324c7b74fce13fca362b888471e196b54041786d3669e
            coordinate: interface:api:http
