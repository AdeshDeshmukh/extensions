                description: |-
                    How the platform passes the connection details of the database to the workload, as environment
                    variables.

                    Example: a workload that accepts either one PostgreSQL connection URL or separate host, port, user,
                    password and database variables. The platform provides one of the two sets.

                    ```condition
                    kind: datastore
                    interface:
                      type: relational
                      engine: postgres
                    configuration:
                      alternatives:
                      - env:
                        - property: url
                          name: DATABASE_URL
                          sensitive: true
                      - env:
                        - property: hostname
                          name: DB_HOST
                        - property: port
                          name: DB_PORT
                        - property: username
                          name: DB_USER
                        - property: password
                          name: DB_PASSWORD
                          sensitive: true
                        - property: database
                          name: DB_NAME
                    ```
