      owner: https://runtimeconditions.io/extensions/rc/env-configuration/v1alpha4/runtimeconditions.extension.yaml
      id: configuration-shape
      exact:
        $defs:
            envInput:
                additionalProperties: false
                description: One environment variable the workload reads. Requires property and name; no other properties are allowed.
                properties:
                    name:
                        description: The environment variable name, for example REDIS_URL. Must start with a letter or underscore and contain only letters, digits and underscores.
                        pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                        type: string
                    property:
                        description: Which connection detail the variable carries, such as url or password. Must not be empty; each integration allows a fixed set of properties.
                        minLength: 1
                        type: string
                    required:
                        description: True when the workload cannot start without this variable.
                        type: boolean
                    sensitive:
                        description: True when the value is a secret, such as a password or token, so the platform can store and pass it securely.
                        type: boolean
                required:
                    - name
                    - property
                type: object
            envList:
                description: List at least one environment variable, without repeats.
                items:
                    $ref: '#/$defs/envInput'
                minItems: 1
                type: array
                uniqueItems: true
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: true
        properties:
            configuration:
                description: Give either env (one set of variables) or alternatives (two or more sets the workload accepts, in order of preference), not both.
                oneOf:
                    - additionalProperties: false
                      properties:
                        alternatives:
                            description: List at least two alternative sets of variables. The platform satisfies one of them.
                            items:
                                additionalProperties: false
                                description: One alternative. Requires env; no other properties are allowed.
                                properties:
                                    env:
                                        $ref: '#/$defs/envList'
                                required:
                                    - env
                                type: object
                            minItems: 2
                            type: array
                      required:
                        - alternatives
                    - additionalProperties: false
                      properties:
                        env:
                            $ref: '#/$defs/envList'
                      required:
                        - env
                type: object
        type: object
      projection:
        kind: object
        properties:
            - name: configuration
              shape:
                kind: object
                properties:
                    - name: alternatives
                      shape:
                        kind: array
                        items:
                            kind: object
                            required:
                                - env
                            properties:
                                - name: env
                                  required: true
                                  shape:
                                    kind: array
                                    items:
                                        kind: object
                                        required:
                                            - name
                                            - property
                                        properties:
                                            - name: name
                                              required: true
                                              shape:
                                                kind: scalar
                                                scalar: string
                                                constraints:
                                                    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                                                description: The environment variable name, for example REDIS_URL. Must start with a letter or underscore and contain only letters, digits and underscores.
