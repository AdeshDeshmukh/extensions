                description: |-
                    How the platform passes the address and credentials of the HTTP API to the workload, as environment
                    variables.

                    Example: a workload that reads the todos API base URL and an access token from its environment.

                    ```condition
                    kind: api
                    interface:
                      type: http
                      spec:
                        format: openapi
                        uri: catalog://api/default/todos-api
                    configuration:
                      env:
                      - property: baseUrl
                        name: TODOS_API_URL
                        required: true
                      - property: token
                        name: TODOS_API_TOKEN
                        sensitive: true
                    ```

                    Give either env (one set of variables) or alternatives (two or more sets the workload accepts, in order of preference), not both.
