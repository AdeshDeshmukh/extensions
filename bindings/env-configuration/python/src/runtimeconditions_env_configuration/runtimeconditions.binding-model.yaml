                description: |-
                    How the platform passes the SMTP server details and email addresses to the workload, as environment
                    variables.

                    Example: a workload that sends email through an SMTP server and reads the server, login and sender
                    address from its environment.

                    ```condition
                    kind: api
                    interface:
                      type: smtp
                      operations:
                      - send
                    configuration:
                      env:
                      - property: hostname
                        name: SMTP_HOST
                        required: true
                      - property: port
                        name: SMTP_PORT
                      - property: username
                        name: SMTP_USER
                      - property: password
                        name: SMTP_PASSWORD
                        sensitive: true
                      - property: fromAddress
                        name: MAIL_FROM
                    ```
