          owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
          kind: aws.sqs
          interfaceType: message_move_task
          description: The name of the queue Condition to move messages to. If you leave it out, the platform, or the person who runs the move, decides.
          path: interface.destinationQueueRef
          segments:
