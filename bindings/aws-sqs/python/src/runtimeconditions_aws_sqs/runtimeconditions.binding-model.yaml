        - coordinate: field-domain:aws.sqs:queue:interface.operations[].name
          owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
          kind: aws.sqs
          interfaceType: queue
          path: interface.operations[].name
          segments:
            - name: interface
            - name: operations
              array: true
            - name: name
          values:
            - value: AddPermission
              description: Give another AWS account permission to use the queue.
            - value: ChangeMessageVisibility
              description: Change how long one received message stays hidden.
            - value: ChangeMessageVisibilityBatch
              description: Change how long several received messages stay hidden, in one call.
            - value: DeleteMessage
              description: Delete one message after it was received.
            - value: DeleteMessageBatch
              description: Delete several received messages in one call.
            - value: DeleteQueue
              description: Delete the queue and all its messages.
            - value: GetQueueAttributes
              description: Read the queue settings.
            - value: GetQueueUrl
              description: Find the URL of a queue that already exists.
            - value: ListDeadLetterSourceQueues
              description: List the queues that use this queue as their dead-letter queue.
            - value: ListQueueTags
              description: Read the queue tags.
            - value: PurgeQueue
              description: Delete all messages in the queue.
            - value: ReceiveMessage
              description: Receive messages from the queue.
            - value: RemovePermission
              description: Take away a permission that AddPermission gave.
            - value: SendMessage
              description: Send one message.
            - value: SendMessageBatch
              description: Send several messages in one call.
            - value: SetQueueAttributes
              description: Change the queue settings or its access policy.
            - value: TagQueue
              description: Add tags to the queue, or change them.
            - value: UntagQueue
              description: Remove tags from the queue.
          provenance:
            owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 442ab39e646bfb5242cc7e1aeddea4a998a0b7a3082a6b34fc5b36c6e443804f
            coordinate: field-domain:aws.sqs:queue:interface.operations[].name
