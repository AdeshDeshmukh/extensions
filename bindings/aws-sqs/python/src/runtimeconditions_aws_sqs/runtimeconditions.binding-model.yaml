          interfaceType: queue
          path: interface.redriveAllowPolicy.mode
          segments:
            - name: interface
            - name: redriveAllowPolicy
            - name: mode
          values:
            - value: allowAll
              description: Any queue in the same AWS account and Region may use this queue as its dead-letter queue.
            - value: byQueue
              description: Only the queues named in sourceQueueRefs may use this queue as their dead-letter queue.
            - value: denyAll
