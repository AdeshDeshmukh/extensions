    ownedDeclarations:
        - coordinate: kind:aws.sqs
          owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
          kind: aws.sqs
          description: |-
            Your workload needs Amazon SQS, with the settings and operations listed in the Condition.

            Example: a worker that receives orders from a queue, and deletes each message after it has handled
            the order.

            ```condition
            kind: aws.sqs
            interface:
              type: queue
              operations:
                - name: ReceiveMessage
                - name: DeleteMessage
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 442ab39e646bfb5242cc7e1aeddea4a998a0b7a3082a6b34fc5b36c6e443804f
            coordinate: kind:aws.sqs
    interfaces:
        - coordinate: interface:aws.sqs:message_move_task
          owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
          kind: aws.sqs
          type: message_move_task
          description: |-
            Your workload moves messages out of one dead-letter queue, for example back to the queue they came
            from. AWS calls this a redrive. AWS gives each move a task ID only while the workload runs, so the
            task ID is not part of the Condition.

            Example: an operations tool that moves failed messages from the orders-dead-letter queue back to
            the orders queue, at most 50 messages each second.

            ```condition
            kind: aws.sqs
            interface:
              type: message_move_task
              sourceQueueRef: orders-dead-letter
              destinationQueueRef: orders
              maxMessagesPerSecond: 50
              operations:
                - name: StartMessageMoveTask
                - name: ListMessageMoveTasks
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 442ab39e646bfb5242cc7e1aeddea4a998a0b7a3082a6b34fc5b36c6e443804f
            coordinate: interface:aws.sqs:message_move_task
        - coordinate: interface:aws.sqs:queue
          owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
          kind: aws.sqs
          type: queue
          description: |-
            Your workload uses one SQS queue. It sends or receives messages, or it manages the queue.

            Example: a FIFO queue that is encrypted with keys that SQS manages. A message that fails five times
            goes to the queue Condition named orders-dead-letter.

            ```condition
            kind: aws.sqs
            interface:
              type: queue
              queueType: fifo
              contentBasedDeduplication: true
              visibilityTimeoutSeconds: 60
              encryption:
                mode: sqs_managed
              deadLetterQueue:
                queueRef: orders-dead-letter
                maxReceiveCount: 5
              operations:
                - name: SendMessage
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 442ab39e646bfb5242cc7e1aeddea4a998a0b7a3082a6b34fc5b36c6e443804f
            coordinate: interface:aws.sqs:queue
        - coordinate: interface:aws.sqs:service
          owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
          kind: aws.sqs
          type: service
          description: |-
            Your workload creates queues, or lists the queues in its AWS account and Region. It does not need a
            queue to exist first.

            Example: a workload that creates its own queues while it runs.

            ```condition
            kind: aws.sqs
            interface:
              type: service
              operations:
                - name: CreateQueue
            ```
          provenance:
            owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 442ab39e646bfb5242cc7e1aeddea4a998a0b7a3082a6b34fc5b36c6e443804f
            coordinate: interface:aws.sqs:service
    interfaceFields:
