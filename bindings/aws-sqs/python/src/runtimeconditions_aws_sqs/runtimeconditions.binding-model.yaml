          interfaceType: queue
          path: interface.queueType
          segments:
            - name: interface
            - name: queueType
          values:
            - value: fifo
              description: A FIFO queue. Messages in the same message group arrive in order, and duplicates are removed.
            - value: standard
              description: A Standard queue. Each message arrives at least once, and the order is not guaranteed.
          provenance:
            owner: https://runtimeconditions.io/extensions/aws/sqs/0.2.0/runtimeconditions.extension.yaml
            extensionSha256: 442ab39e646bfb5242cc7e1aeddea4a998a0b7a3082a6b34fc5b36c6e443804f
            coordinate: field-domain:aws.sqs:queue:interface.queueType
