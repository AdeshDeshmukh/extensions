                    minLength: 1
                    type: string
                minItems: 1
                type: array
                uniqueItems: true
            policyOperation:
                additionalProperties: false
                description: Canonical operation selector using the same vocabulary as workload operations; regional ListQueues is outside queue policy scope.
                properties:
                    name:
                        description: One queue, task, or CreateQueue operation name; platform mapping determines policy applicability and effective authorization.
                        enum:
                            - AddPermission
                            - CancelMessageMoveTask
                            - ChangeMessageVisibility
                            - ChangeMessageVisibilityBatch
                            - CreateQueue
                            - DeleteMessage
                            - DeleteMessageBatch
                            - DeleteQueue
                            - GetQueueAttributes
                            - GetQueueUrl
                            - ListDeadLetterSourceQueues
                            - ListMessageMoveTasks
                            - ListQueueTags
                            - PurgeQueue
                            - ReceiveMessage
                            - RemovePermission
                            - SendMessage
                            - SendMessageBatch
                            - SetQueueAttributes
                            - StartMessageMoveTask
                            - TagQueue
                            - UntagQueue
                        type: string
                required:
                    - name
                type: object
            queueRef:
                description: Non-empty name of an aws.sqs/queue Condition in this profile; the adapter resolves and checks the reference.
                minLength: 1
                type: string
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: true
        description: Requires an aws.sqs queue interface; configuration and operations are optional and have no defaults.
        properties:
            interface:
                additionalProperties: true
                allOf:
                    - description: FIFO-only settings require an explicit FIFO queue type.
                      if:
                        anyOf:
                            - required:
                                - contentBasedDeduplication
                            - required:
                                - deduplicationScope
                            - required:
                                - fifoThroughputLimit
                      then:
                        properties:
                            queueType:
                                const: fifo
                        required:
                            - queueType
                    - description: Per-message-group FIFO throughput requires messageGroup deduplication.
                      if:
                        properties:
                            fifoThroughputLimit:
                                const: perMessageGroupId
                        required:
                            - fifoThroughputLimit
                      then:
                        properties:
                            deduplicationScope:
                                const: messageGroup
                        required:
                            - deduplicationScope
                description: Requires the queue type; each supplied configuration or permission field constrains fulfillment.
                properties:
                    accessPolicy:
                        additionalProperties: false
                        description: Requires non-empty policy statements composed with platform controls; effective authorization must satisfy both or fulfillment fails.
                        properties:
                            statements:
                                description: At least one required statement; additional platform statements remain permitted and must not be removed.
                                items:
                                    additionalProperties: false
                                    description: Requires effect, principals, and actions; the statement applies to this queue and permits no additional properties.
                                    properties:
                                        conditionRefs:
                                            $ref: '#/$defs/bindingRefs'
                                            description: Platform-owned policy bindings applied together to this statement; unresolved names prevent fulfillment and names alone imply no standardized security guarantee.
                                        effect:
                                            description: Must be Allow or Deny; explicit denies retain IAM denial semantics.
                                            enum:
                                                - Allow
                                                - Deny
                                            type: string
                                        operations:
                                            description: Distinct canonical operation selectors; platform mapping must report shared-permission conflicts and must not blindly expand Deny dependencies.
                                            items:
                                                $ref: '#/$defs/policyOperation'
                                            minItems: 1
                                            type: array
                                            uniqueItems: true
                                        principalRefs:
                                            $ref: '#/$defs/bindingRefs'
                                            description: Logical principal bindings; the adapter resolves identities and respects SQS cross-account restrictions.
                                    required:
                                        - effect
                                        - operations
                                        - principalRefs
                                    type: object
                                minItems: 1
                                type: array
                        required:
                            - statements
                        type: object
                    contentBasedDeduplication:
                        description: Boolean FIFO setting; supplying it requires queueType fifo.
                        type: boolean
                    deadLetterQueue:
                        additionalProperties: false
                        description: Requires a named target queue and a positive receive threshold; the adapter checks matching queue types.
                        properties:
                            maxReceiveCount:
                                description: Exact positive configured receive threshold before dead-letter transfer; a larger threshold does not fulfill it.
                                maximum: 1000
                                minimum: 1
                                type: integer
                            queueRef:
                                $ref: '#/$defs/queueRef'
                                description: Name of the destination dead-letter queue Condition; the adapter checks existence, type compatibility, and cycles.
                        required:
                            - maxReceiveCount
                            - queueRef
                        type: object
                    deduplicationScope:
                        description: FIFO deduplication scope; supplying it requires queueType fifo.
                        enum:
                            - messageGroup
                            - queue
                        type: string
                    delaySeconds:
                        description: Exact queue delivery-delay default in seconds, from 0 through 900.
                        maximum: 900
                        minimum: 0
                        type: integer
                    encryption:
                        additionalProperties: false
                        allOf:
                            - description: A key binding or data-key reuse period requires KMS encryption.
                              if:
                                anyOf:
                                    - required:
                                        - dataKeyReusePeriodSeconds
                                    - required:
                                        - keyRef
                              then:
                                properties:
                                    mode:
                                        const: kms
                        description: Requires a mode; KMS-specific settings are permitted only with mode kms.
                        properties:
                            dataKeyReusePeriodSeconds:
                                description: Exact KMS data-key reuse period in seconds, from 60 through 86400.
                                maximum: 86400
                                minimum: 60
                                type: integer
                            keyRef:
                                description: Non-empty logical KMS key binding resolved by the adapter; not a literal key ID or ARN and not a KMS permission grant.
                                minLength: 1
                                type: string
                            mode:
                                description: Must be none, sqs_managed, or kms; omission of the whole object imposes no encryption requirement.
                                enum:
                                    - kms
                                    - none
                                    - sqs_managed
                                type: string
                        required:
                            - mode
                        type: object
                    fifoThroughputLimit:
                        description: FIFO quota boundary; perMessageGroupId requires messageGroup deduplication.
                        enum:
                            - perMessageGroupId
                            - perQueue
                        type: string
                    maximumMessageSizeBytes:
                        description: Exact configured message-size limit in bytes, from 1024 through 1048576.
                        maximum: 1.048576e+06
                        minimum: 1024
                        type: integer
                    messageRetentionPeriodSeconds:
                        description: Exact message retention in seconds, from 60 through 1209600; neither a minimum nor a ceiling.
                        maximum: 1.2096e+06
                        minimum: 60
                        type: integer
                    operations:
                        description: A non-empty list of distinct canonical queue operations; no IAM action selection is accepted.
                        items:
                            additionalProperties: false
                            description: One canonical operation object; only its required name is accepted.
                            properties:
