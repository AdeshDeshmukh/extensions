                        minItems: 1
                        type: array
                        uniqueItems: true
                    queueType:
                        description: If present, must be standard or fifo; omission permits either queue type.
                        enum:
                            - fifo
                            - standard
                        type: string
                    receiveMessageWaitTimeSeconds:
                        description: Exact queue long-poll default in seconds, from 0 through 20.
                        maximum: 20
                        minimum: 0
