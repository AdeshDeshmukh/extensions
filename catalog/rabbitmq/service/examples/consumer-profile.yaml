apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: order-consumer
workload:
  uri: https://example.com/order-consumer
extensions:
  - https://runtimeconditions.io/extensions/rabbitmq/service/0.2.0/runtimeconditions.extension.yaml:0.2.0
conditions:
  - name: order-messaging
    kind: rabbitmq.service
    interface:
      type: amqp_0_9_1
      virtualHost: /orders
      operations:
        - resource: queue
          action: consume
          queue: order-workers
