apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: order-publisher
workload:
  uri: https://example.com/order-publisher
extensions:
  - https://runtimeconditions.io/extensions/rabbitmq/service/0.1.0/runtimeconditions.extension.yaml:0.1.0
conditions:
  - name: order-messaging
    kind: rabbitmq.service
    interface:
      type: amqp_0_9_1
      virtualHost: /orders
      operations:
        - resource: exchange
          action: publish
          exchange: order-events
          routingKey: orders.created
