apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: checkout-telemetry
workload:
  uri: https://example.com/checkout
extensions:
  - https://runtimeconditions.io/extensions/rc/observability/0.2.0/runtimeconditions.extension.yaml:0.2.0
conditions:
  - name: telemetry-collector
    kind: rc.observability
    interface:
      type: otlp_export
      signals: [traces, metrics]
      transport: grpc
