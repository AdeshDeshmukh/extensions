apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: order-reader
workload:
  uri: https://example.com/order-reader
extensions:
  - https://runtimeconditions.io/extensions/kafka/service/0.2.0/runtimeconditions.extension.yaml:0.2.0
conditions:
  - name: order-events
    kind: kafka.service
    interface:
      type: service
      operations:
        - resource: topic
          action: read
          topic: orders
