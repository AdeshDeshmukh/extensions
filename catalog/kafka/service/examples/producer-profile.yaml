apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: order-producer
workload:
  uri: https://example.com/order-producer
extensions:
  - https://runtimeconditions.io/extensions/kafka/service/0.1.0/runtimeconditions.extension.yaml:0.1.0
conditions:
  - name: order-events
    kind: kafka.service
    interface:
      type: service
      operations:
        - resource: topic
          action: write
          topic: orders
